name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build \
            mingw-w64 \
            wine wine32:i386

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=$(date +%Y-%m-%d)" >> "$GITHUB_ENV"
          fi

      - name: Build and package
        run: |
          chmod +x package-release.sh
          ./package-release.sh "$RELEASE_TAG" build

      - name: Create git tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG"; then
            git push origin ":refs/tags/$RELEASE_TAG"
          fi
          git tag -f "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$RELEASE_TAG" --yes || true
          gh release create "$RELEASE_TAG" \
            "build/dxup-$RELEASE_TAG.tar.gz" \
            --title "dxup-$RELEASE_TAG" \
            --notes "Automated build of ${{ github.sha }}"
